<ion-header>
  <ion-toolbar color="tertiary">
    <ion-title>Caderno do técnico</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="saveAndClose()">Salvar e fechar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <p class="notebook-hint">
    Anotações locais (escalações, promessas de reforço, lembretes). Ficam só neste
    navegador — exporte saves pelo menu se for trocar de aparelho.
  </p>
  <ion-textarea
    [(ngModel)]="notes"
    (ionInput)="onNotesInput()"
    [autoGrow]="true"
    rows="14"
    placeholder="Ex.: vender meia-atacante na janela 2; testar 4-3-3 com segundo volante..."
    class="notebook-textarea"
    aria-label="Anotações do técnico"
  ></ion-textarea>
  <ion-note color="medium">{{ notes.length }} / {{ maxLen }} caracteres</ion-note>
</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button fill="solid" color="primary" (click)="saveAndClose()" [disabled]="saving">
        Salvar
      </ion-button>
      <ion-button fill="clear" (click)="dismiss()">Fechar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
